<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BUT · 露天画布 / Open-Air Canvas (AMCC 5140)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0B1014; --ink2:#0E1518; --panel:rgba(20,28,34,.72);
    --teal:#0E8B82; --teal-soft:rgba(14,139,130,.16);
    --amber:#C2780A; --line:rgba(255,255,255,.06);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:#E8EEF2;font-family:var(--font);}
  #stage{
    position:fixed;inset:0;cursor:grab;
    background:
      radial-gradient(1200px 800px at 30% 20%, rgba(14,139,130,.10), transparent 60%),
      radial-gradient(1000px 700px at 80% 90%, rgba(194,120,10,.08), transparent 60%),
      linear-gradient(160deg,#0C1216,#080C0F);
  }
  #stage.dragging{cursor:grabbing;}
  /* 网格地面（无限感） */
  #world{
    position:absolute;left:0;top:0;will-change:transform;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:120px 120px;
  }
  #world::after{ /* 暗角 */
    content:"";position:fixed;inset:0;pointer-events:none;
    box-shadow:inset 0 0 240px 60px rgba(0,0,0,.55);
  }

  .av{position:absolute;left:0;top:0;width:56px;will-change:transform;transition:opacity .2s;}
  .tile{
    position:relative;width:56px;height:56px;border-radius:16px;overflow:visible;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px rgba(0,0,0,.45);
    animation:bob 3.2s ease-in-out infinite;
    border:1px solid rgba(255,255,255,.12);
  }
  .av:nth-child(2n) .tile{animation-delay:.8s;}
  .av:nth-child(3n) .tile{animation-delay:1.6s;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .face{width:100%;height:100%;border-radius:15px;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);object-fit:cover;}
  .face img{width:100%;height:100%;border-radius:15px;object-fit:cover;display:block;}
  .tag{
    position:absolute;left:50%;top:62px;transform:translateX(-50%);
    font-size:11px;font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:8px;
    background:rgba(8,12,15,.85);border:1px solid var(--line);color:#E8EEF2;
    opacity:0;pointer-events:none;transition:opacity .15s;letter-spacing:.3px;
  }
  .av.hover .tag{opacity:1;}
  .wave{
    position:absolute;left:34px;top:-10px;font-size:20px;opacity:0;transform:scale(.4) rotate(-12deg);
    transition:all .18s;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  .av.wave .wave,.av.hover .wave{opacity:1;transform:scale(1) rotate(12deg);animation:wave .6s ease-in-out infinite;}
  @keyframes wave{0%,100%{transform:scale(1) rotate(8deg)}50%{transform:scale(1.06) rotate(20deg)}}
  .prop{
    position:absolute;right:-6px;bottom:18px;width:26px;height:26px;border-radius:8px;overflow:hidden;
    border:2px solid rgba(8,12,15,.9);background:#11181d;box-shadow:0 3px 8px rgba(0,0,0,.5);
  }
  .prop img{width:100%;height:100%;object-fit:cover;display:block;}
  .wsymbol{position:absolute;left:6px;top:34px;font-size:13px;opacity:.85;}

  /* HUD */
  .hud{position:fixed;pointer-events:none;z-index:10;}
  .hud-tl{top:18px;left:20px;}
  .hud-tl .kick{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--teal);font-weight:700;}
  .hud-tl h1{margin:4px 0 2px;font-size:19px;font-weight:800;letter-spacing:.3px;}
  .hud-tl p{margin:0;font-size:11.5px;color:#8fa0ab;font-family:var(--mono);}
  .hud-tr{top:18px;right:20px;text-align:right;}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    padding:6px 12px;border-radius:20px;font-size:11px;font-family:var(--mono);color:#bcd;border:1px solid rgba(14,139,130,.3);}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal);}
  .back{
    position:fixed;bottom:18px;left:20px;z-index:10;pointer-events:auto;
    display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    color:#cdd8e0;font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:12px;cursor:pointer;text-decoration:none;
    backdrop-filter:blur(6px);transition:all .15s;
  }
  .back:hover{background:rgba(14,139,130,.18);border-color:rgba(14,139,130,.4);color:#fff;}
  .hint{
    position:fixed;bottom:18px;right:20px;z-index:10;font-family:var(--mono);font-size:10.5px;color:#6f818d;
    background:var(--panel);border:1px solid var(--line);padding:7px 13px;border-radius:10px;pointer-events:none;
  }
  .legend{position:fixed;bottom:60px;right:20px;z-index:10;font-size:10.5px;color:#7e909b;font-family:var(--mono);
    background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:10px;line-height:1.7;pointer-events:none;}
  .legend b{color:#cdd8e0;}
</style>
</head>
<body>
<div id="stage">
  <div id="world"></div>
</div>

<div class="hud hud-tl">
  <div class="kick">OPEN-AIR CANVAS · 5140</div>
  <h1>露天画布</h1>
  <p>43 位在册记录员正在游荡 · 相遇就挥手</p>
</div>
<div class="hud hud-tr">
  <span class="pill"><span class="dot"></span><span id="liveCount">43</span> ONLINE</span>
</div>
<div class="legend">
  <b>拖动</b> 平移画布<br/>
  <b>悬浮</b> 抬头挥手<br/>
  <b>相遇</b> 自动打招呼
</div>
<a class="back" href="but_class.html">← 返回在册目录</a>
<div class="hint">desktop only · 拖拽探索</div>

<script>
(function(){
  "use strict";
  var SUPABASE = {
    url: 'https://oqncytczllfrgztyxbrn.supabase.co',
    anonKey: 'sb_publishable_qLQjPrv_4vGo1_3ro1JDQA_54WFCRPQ'
  };
  var sb = null;
  try { if (window.supabase) sb = window.supabase.createClient(SUPABASE.url, SUPABASE.anonKey); } catch(e){}

  // 43 人名单（与 but_class.html 同源）
  var ROSTER = [
    {en:'CHAU, Ching Ho',zh:'周静可',wk:2},{en:'CHEN, Kexin',zh:'陈可心',wk:2},{en:'CHEN, Xingyi',zh:'陈兴怡',wk:2},
    {en:'CUI, Yujie',zh:'崔雨洁',wk:2},{en:'DAI, Zhenlin',zh:'代振林',wk:2},{en:'DING, Yiling',zh:'丁怡铃',wk:2},
    {en:'FU, Jiayi',zh:'傅嘉仪',wk:2},{en:'GAO, Song',zh:'高嵩',wk:2},{en:'GU, Siyun',zh:'古思芸',wk:2},
    {en:'HU, Chenrui',zh:'胡辰睿',wk:2},{en:'HUANG, Ping',zh:'黄娉',wk:2},{en:'HUANG, Weiyue',zh:'黄威越',wk:2},
    {en:'HUANG, Yu',zh:'黄禹',wk:2},{en:'KONG, Xinyue',zh:'孔昕悦',wk:2},{en:'LI, Boang',zh:'李钹昂',wk:2},
    {en:'LI, Jingyi',zh:'李靖仪',wk:3},{en:'LI, Weirong',zh:'李维嵘',wk:3},{en:'LIAO, Ziting',zh:'廖梓廷',wk:3},
    {en:'LIN, Ruixuan',zh:'林睿萱',wk:3},{en:'LIN, Xinxuan',zh:'林歆璇',wk:3},{en:'LING, Jierong',zh:'凌洁榕',wk:3},
    {en:'LIU, Siyong',zh:'刘斯庸',wk:3},{en:'LIU, Xintong',zh:'刘信彤',wk:3},{en:'PAN, Juncheng',zh:'潘俊成',wk:3},
    {en:'TAI, Ava Siu Chi',zh:'戴筱之',wk:3},{en:'WANG, Zeyu',zh:'汪泽宇',wk:3},{en:'WEI, Qian',zh:'韦茜',wk:3},
    {en:'XIA, Yuhan',zh:'夏宇涵',wk:3},{en:'XIAO, Qingrou',zh:'肖清柔',wk:3},{en:'XIAO, Yanlan',zh:'肖雁蓝',wk:3},
    {en:'XIE, Yiqian',zh:'谢依倩',wk:4},{en:'XU, Da',zh:'徐达',wk:4},{en:'XU, Zhaohui',zh:'徐昭慧',wk:4},
    {en:'YU, Hongge',zh:'余洪哿',wk:4},{en:'YU, Peiqi',zh:'于沛琦',wk:4},{en:'ZHANG, Keying',zh:'张可莹',wk:4},
    {en:'ZHANG, Ranyun',zh:'张冉昀',wk:4},{en:'ZHANG, Shihan',zh:'张诗涵',wk:4},{en:'ZHONG, Jun',zh:'钟君',wk:4},
    {en:'ZHOU, Zimeng',zh:'周子盟',wk:4},{en:'HOU, Shiqin',zh:'侯诗琴',wk:2},{en:'RAO, Anyi',zh:'饶安逸',wk:3},
    {en:'ZHANG, Tony',zh:'张天毅',wk:4}
  ];

  var WORLD_W = 3200, WORLD_H = 2200;
  var cam = { x: WORLD_W/2 - window.innerWidth/2, y: WORLD_H/2 - window.innerHeight/2 };
  var world = document.getElementById('world');
  world.style.width = WORLD_W + 'px';
  world.style.height = WORLD_H + 'px';

  function hashHue(str){ var h=0; for (var i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))%360; } return h; }
  function initial(zh,en){ if (zh && /[\u4e00-\u9fa5]/.test(zh[0])) return zh[0]; return (en||'?')[0]; }

  var STATES = ['walk','walk','walk','idle','idle','sit','yawn','sleep'];
  var avatars = ROSTER.map(function(r,i){
    var id = 'C' + String(i+1).padStart(2,'0');
    var hue = hashHue(id);
    var a = {
      id:id, zh:r.zh, en:r.en, wk:r.wk,
      x: 200 + Math.random()*(WORLD_W-400),
      y: 200 + Math.random()*(WORLD_H-400),
      vx:0, vy:0, ang:Math.random()*Math.PI*2,
      state:'walk', stateT: 1+Math.random()*3,
      waveT:0, hover:false, phase:Math.random()*10,
      avatarUrl:'', propUrl:'', bgUrl:'', hue:hue,
      el:null
    };
    buildEl(a);
    return a;
  });

  function buildEl(a){
    var el = document.createElement('div');
    el.className = 'av';
    var grad = 'linear-gradient(145deg, hsl('+a.hue+',52%,46%), hsl('+((a.hue+28)%360)+',48%,34%))';
    el.innerHTML =
      '<div class="tile" style="background:'+grad+'">'+
        '<div class="face">'+initial(a.zh,a.en)+'</div>'+
        '<div class="wave">👋</div>'+
        '<div class="prop" style="display:none"></div>'+
      '</div>'+
      '<div class="tag">'+a.zh+'</div>';
    el.addEventListener('mouseenter', function(){ a.hover=true; });
    el.addEventListener('mouseleave', function(){ a.hover=false; });
    a.el = el;
    world.appendChild(el);
  }

  function renderEl(a){
    a.el.style.transform = 'translate('+a.x.toFixed(1)+'px,'+a.y.toFixed(1)+'px)';
    var visible = (a.x > cam.x-90 && a.x < cam.x+window.innerWidth+90 &&
                   a.y > cam.y-90 && a.y < cam.y+window.innerHeight+90);
    a.el.style.display = visible ? 'block' : 'none';
    var waving = a.waveT > 0 || a.hover;
    a.el.classList.toggle('wave', waving);
    a.el.classList.toggle('hover', a.hover);
    // 睡眠态给个 💤
    var w = a.el.querySelector('.wave');
    w.textContent = (a.state==='sleep' && !a.hover) ? '💤' : '👋';
  }

  function applyMedia(a){
    var face = a.el.querySelector('.face');
    if (a.avatarUrl){
      face.innerHTML = '<img src="'+a.avatarUrl+'" alt="">';
    } else {
      face.textContent = initial(a.zh,a.en);
    }
    var prop = a.el.querySelector('.prop');
    if (a.propUrl){ prop.style.display='block'; prop.innerHTML='<img src="'+a.propUrl+'" alt="道具">'; }
    else { prop.style.display='none'; }
  }

  // 云端拉真实头像 / 道具 / 概念（桌面端可达；拉不到就用本地花名册）
  function enrich(){
    if (!sb) return;
    sb.from('subjects').select('id, avatar, prop, ip_image, ip_concept').limit(200)
      .then(function(res){
        if (res.error) return;
        var map = {}; res.data.forEach(function(r){ map[r.id]=r; });
        avatars.forEach(function(a){
          var r = map[a.id];
          if (!r) return;
          if (r.avatar) a.avatarUrl = r.avatar;
          if (r.prop)   a.propUrl   = r.prop;
          if (r.ip_image) a.bgUrl = r.ip_image;
          applyMedia(a);
        });
      }).catch(function(){ /* 离线/被墙：静默用本地 */ });
  }

  // 相遇检测（O(n^2)，43 人足够）
  function checkEncounters(){
    for (var i=0;i<avatars.length;i++){
      for (var j=i+1;j<avatars.length;j++){
        var a=avatars[i], b=avatars[j];
        var dx=a.x-b.x, dy=a.y-b.y;
        if (dx*dx+dy*dy < 52*52 && a.waveT<=0 && b.waveT<=0){
          // 都醒着才打招呼
          if (a.state!=='sleep' && b.state!=='sleep'){ a.waveT=1.4; b.waveT=1.4; }
        }
      }
    }
  }

  var last = performance.now();
  function tick(now){
    var dt = Math.min(0.05, (now-last)/1000); last = now;
    avatars.forEach(function(a){
      // 状态机
      a.stateT -= dt;
      if (a.stateT <= 0){
        a.state = STATES[Math.floor(Math.random()*STATES.length)];
        a.stateT = 1 + Math.random()*3.5;
      }
      if (a.waveT > 0) a.waveT -= dt;

      // 移动：平滑游走（分层正弦噪声）
      if (a.waveT > 0 || a.hover || a.state==='idle' || a.state==='sit' || a.state==='sleep' || a.state==='yawn'){
        a.vx *= 0.86; a.vy *= 0.86;
      } else {
        a.phase += dt;
        var ang = (Math.sin(a.x*0.0021 + a.phase*0.3) + Math.cos(a.y*0.0027 - a.phase*0.2)) * Math.PI;
        var sp = (a.state==='walk') ? 46 : 30;
        a.vx = Math.cos(ang)*sp; a.vy = Math.sin(ang)*sp;
      }
      a.x += a.vx*dt; a.y += a.vy*dt;
      // 边界反弹
      if (a.x < 50){ a.x=50; } if (a.x > WORLD_W-50){ a.x=WORLD_W-50; }
      if (a.y < 50){ a.y=50; } if (a.y > WORLD_H-50){ a.y=WORLD_H-50; }
      renderEl(a);
    });
    checkEncounters();
    requestAnimationFrame(tick);
  }

  // 拖拽平移
  var stage = document.getElementById('stage');
  var dragging=false, lx=0, ly=0;
  stage.addEventListener('pointerdown', function(e){ dragging=true; lx=e.clientX; ly=e.clientY; stage.classList.add('dragging'); });
  window.addEventListener('pointerup', function(){ dragging=false; stage.classList.remove('dragging'); });
  window.addEventListener('pointermove', function(e){
    if (!dragging) return;
    cam.x -= (e.clientX - lx); cam.y -= (e.clientY - ly);
    lx=e.clientX; ly=e.clientY;
    cam.x = Math.max(-200, Math.min(WORLD_W-window.innerWidth+200, cam.x));
    cam.y = Math.max(-200, Math.min(WORLD_H-window.innerHeight+200, cam.y));
    world.style.transform = 'translate('+(-cam.x)+'px,'+(-cam.y)+'px)';
  });
  // 键盘微调
  window.addEventListener('keydown', function(e){
    var step=60;
    if (e.key==='ArrowLeft') cam.x-=step; if (e.key==='ArrowRight') cam.x+=step;
    if (e.key==='ArrowUp') cam.y-=step; if (e.key==='ArrowDown') cam.y+=step;
    cam.x=Math.max(-200,Math.min(WORLD_W-window.innerWidth+200,cam.x));
    cam.y=Math.max(-200,Math.min(WORLD_H-window.innerHeight+200,cam.y));
    world.style.transform='translate('+(-cam.x)+'px,'+(-cam.y)+'px)';
  });
  window.addEventListener('resize', function(){
    world.style.transform='translate('+(-cam.x)+'px,'+(-cam.y)+'px)';
  });

  world.style.transform = 'translate('+(-cam.x)+'px,'+(-cam.y)+'px)';
  avatars.forEach(applyMedia);
  document.getElementById('liveCount').textContent = avatars.length;
  requestAnimationFrame(tick);
  enrich();
})();
</script>
</body>
</html>
